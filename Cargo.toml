[package]
name = "ledger-tui"
version = "0.1.0"
edition = "2021"
description = "local double-entry bookkeeping TUI with charts"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
home = "0.5"
ratatui = "0.29"
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[[bin]]
name = "lgr"
path = "src/main.rs"
